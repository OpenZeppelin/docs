name: Lint & Format

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  lint:
    name: Lint and Format Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint and format checks
        run: pnpm run check

      - name: Test MDX anchor extraction
        run: node --import tsx --test scripts/link-anchors.test.ts

      # Output mode reports the existing fragment backlog without failing the PR.
      # Parsing or execution failures still fail this step.
      - name: Report broken fragment links
        run: pnpm run lint:links --no-ignore-fragments --output link-errors.txt

      - name: Upload link report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: link-errors
          path: link-errors.txt
          if-no-files-found: error

      - name: Build check
        run: pnpm run build
